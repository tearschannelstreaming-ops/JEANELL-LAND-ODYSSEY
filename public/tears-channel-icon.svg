<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Chrome Bevel -->
    <linearGradient id="chromeRim" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="90%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Inner Chrome Ring -->
    <linearGradient id="chromeInner" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Brushed Silver Medallion Center -->
    <radialGradient id="silverCenter" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- 3D Chrome Letter Fill -->
    <linearGradient id="chromeLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- 3D Chrome Teardrop -->
    <radialGradient id="chromeDrop" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <filter id="dropShadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.6"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>

    <path id="tearsArc" d="M 106,260 A 154,154 0 0,1 406,260" />
  </defs>

  <!-- Medallion Drop Shadow -->
  <circle cx="262" cy="264" r="228" fill="#0f172a" opacity="0.35"/>

  <!-- Outer Chrome Medallion Ring -->
  <circle cx="256" cy="256" r="228" fill="url(#chromeRim)" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="256" cy="256" r="208" fill="url(#chromeInner)" stroke="#ffffff" stroke-width="2"/>

  <!-- Brushed Silver Face -->
  <circle cx="256" cy="256" r="196" fill="url(#silverCenter)" stroke="#64748b" stroke-width="1.5"/>

  <!-- Arched T.E.A.R.S. 3D Chrome Letters -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="60" fill="url(#chromeLetter)" stroke="#334155" stroke-width="3" letter-spacing="2" filter="url(#dropShadow3D)">
    <textPath href="#tearsArc" startOffset="50%" text-anchor="middle">
      T.E.A.R.S.
    </textPath>
  </text>

  <!-- Left 3D Chrome Teardrop -->
  <g transform="translate(132, 322)" filter="url(#dropShadow3D)">
    <path d="M 0,-48 C 11,-22 24,-2 24,16 A 24,24 0 1,1 -24,16 C -24,-2 -11,-22 0,-48 Z" fill="url(#chromeDrop)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="-7" cy="12" rx="6" ry="11" transform="rotate(-18 -7 12)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Right 3D Chrome Teardrop -->
  <g transform="translate(380, 322)" filter="url(#dropShadow3D)">
    <path d="M 0,-48 C 11,-22 24,-2 24,16 A 24,24 0 1,1 -24,16 C -24,-2 -11,-22 0,-48 Z" fill="url(#chromeDrop)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="-7" cy="12" rx="6" ry="11" transform="rotate(-18 -7 12)" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- CHANNEL 3D Chrome Typography -->
  <text x="256" y="344" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#f8fafc" stroke="#475569" stroke-width="1.5" text-anchor="middle" letter-spacing="3" filter="url(#dropShadow3D)">
    CHANNEL
  </text>
</svg>
