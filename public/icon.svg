<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian-navy background matching IMG_0201 / Untitled design - 2 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <!-- Outer metallic silver rim gradient -->
    <linearGradient id="rimOuter" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Inner beveled silver ring -->
    <linearGradient id="rimInner" x1="80%" y1="15%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Brushed silver coin face with diagonal specular sheen -->
    <linearGradient id="coinFace" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="32%" stop-color="#f8fafc"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="88%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3D Chrome Teardrop gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Embossed metallic text gradient -->
    <linearGradient id="textMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="embossShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.65"/>
    </filter>

    <!-- Top curved path for S.T.E.A.R.S. -->
    <path id="stearsArc" d="M 118,266 A 142,142 0 0,1 394,266" />
  </defs>

  <!-- Full-bleed dark background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle dark outer halo -->
  <circle cx="256" cy="256" r="228" fill="#020617" stroke="#1e293b" stroke-width="4"/>

  <!-- Outer Metallic Silver Medallion Rim -->
  <circle cx="256" cy="256" r="214" fill="url(#rimOuter)"/>
  <circle cx="256" cy="256" r="196" fill="url(#rimInner)"/>

  <!-- Main Brushed Silver Coin Face -->
  <circle cx="256" cy="256" r="182" fill="url(#coinFace)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Subtle inner engraved ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>

  <!-- Arched S.T.E.A.R.S. Metallic Typography -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="37" fill="url(#textMetal)" letter-spacing="4" filter="url(#embossShadow)">
    <textPath href="#stearsArc" startOffset="50%" text-anchor="middle">
      S.T.E.A.R.S.
    </textPath>
  </text>

  <!-- Left 3D Metallic Teardrop -->
  <g transform="translate(142, 316)">
    <path d="M 0,-34 C 10,-16 22,-2 22,12 A 22,22 0 1,1 -22,12 C -22,-2 -10,-16 0,-34 Z" fill="url(#dropGrad)" stroke="#f8fafc" stroke-width="2.5"/>
    <ellipse cx="-6" cy="8" rx="5" ry="9" transform="rotate(-20 -6 8)" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Right 3D Metallic Teardrop -->
  <g transform="translate(370, 316)">
    <path d="M 0,-34 C 10,-16 22,-2 22,12 A 22,22 0 1,1 -22,12 C -22,-2 -10,-16 0,-34 Z" fill="url(#dropGrad)" stroke="#f8fafc" stroke-width="2.5"/>
    <ellipse cx="-6" cy="8" rx="5" ry="9" transform="rotate(-20 -6 8)" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Bottom Embossed SAFE Typography -->
  <text x="256" y="356" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="40" fill="url(#textMetal)" text-anchor="middle" letter-spacing="5" filter="url(#embossShadow)">
    SAFE
  </text>
</svg>
