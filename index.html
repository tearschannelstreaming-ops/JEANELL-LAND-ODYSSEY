    <script>
      (function() {
        function isViteHmrError(err, url) {
          if (!err && !url) return false;
          var msg = (typeof err === 'string' ? err : (err && err.message) || '').toLowerCase();
          var stack = ((err && err.stack) || '').toLowerCase();
          var file = (url || '').toLowerCase();
          return (
            msg.includes('websocket') ||
            msg.includes('ws') ||
            stack.includes('@vite/client') ||
            file.includes('@vite/client') ||
            msg.includes('closed without opened')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteHmrError(event.error, event.filename) || isViteHmrError(event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isViteHmrError(error || msg, url)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };
      })();
    </script>
